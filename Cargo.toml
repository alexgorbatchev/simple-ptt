[package]
name = "simple-ptt"
version = "1.6.0"
edition = "2021"

[[bin]]
name = "simple-ptt"
path = "src/main.rs"

[dependencies]
# macOS AppKit bindings (objc2 family)
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSString",
    "NSObject",
    "NSRange",
    "NSThread",
    "NSRunLoop",
    "NSDate",
    "NSTimer",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSComboBox",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontManager",
    "NSGraphics",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSParagraphStyle",
    "NSPopUpButton",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "block2",
    "NSTextView",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3", features = ["objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }

# Audio capture (CoreAudio on macOS)
cpal = "0.18"

# Deepgram streaming and management
bytes = "1"
# Nova shutdown/cancellation fixes on the user's fork, based on SDK 0.11.0.
deepgram = { git = "https://github.com/alexgorbatchev/deepgram-rust-sdk.git", rev = "05dac8affb5ea68948da7b7fc989956e46f05907" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
# The default `derive` feature is disabled because the app uses no rig macros and
# rig-derive pulls a second toml_edit (via deluxe -> proc-macro-crate 1.x).
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
toml_edit = "0.25"

# Logging
log = "0.4"
env_logger = "0.11"
block2 = "0.6"
auto-launch = "0.6.0"
realfft = "3.5"
similar = { version = "3.2", features = ["unicode"] }
