name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign and notarize macOS arm64 release
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BINARY_NAME: simple-ptt
      CARGO_TERM_COLOR: always
      TARGET_TRIPLE: aarch64-apple-darwin
      RUSTFLAGS: "-D warnings"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_PROFILE: simple-ptt-release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update

      - name: Validate tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          cargo_version="$(awk -F'"' '
            $0 == "[package]" { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 ~ /^version = / { print $2; exit }
          ' Cargo.toml)"

          expected_tag="v${cargo_version}"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "release tag $TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Check, test, and build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          cargo test --locked
          cargo build --locked --release --target "$TARGET_TRIPLE"

      - name: Import Developer ID signing identity
        uses: Apple-Actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          keychain-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Authenticate notarization
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?missing APPLE_ID}"
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID}"
          : "${APPLE_SIGNING_IDENTITY:?missing APPLE_SIGNING_IDENTITY}"
          : "${APPLE_NOTARY_PASSWORD:?missing APPLE_NOTARY_PASSWORD}"
          keychain_path="$HOME/Library/Keychains/signing_temp.keychain-db"
          xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" --keychain "$keychain_path"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, and verify distribution
        id: package
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('verification-{0}', github.run_id) }}
        run: |
          set -euo pipefail

          asset_basename="${BINARY_NAME}-${TAG}-macos-arm64"
          archive_path="${RUNNER_TEMP}/${asset_basename}.dmg"
          checksum_path="${RUNNER_TEMP}/${asset_basename}.sha256"

          ./scripts/build-notarized-dmg.sh \
            "target/${TARGET_TRIPLE}/release/${BINARY_NAME}" \
            "$archive_path" "${RUNNER_TEMP}/notarization"

          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Retain notarization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-evidence
          path: |
            ${{ runner.temp }}/notarization/*-notary/*.json
            ${{ runner.temp }}/notarization/*-notary/sha256
            ${{ runner.temp }}/notarization/app-signature.txt
            ${{ runner.temp }}/notarization/app-entitlements.plist
          retention-days: 14

      - name: Retain verification build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-verification-build
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          set -euo pipefail

          # Existing assets may be referenced by Sparkle. Never replace them.
          gh release create "$TAG" "$ARCHIVE_PATH" "$CHECKSUM_PATH" \
            --verify-tag --title "$TAG" --generate-notes
