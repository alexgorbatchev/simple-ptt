name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, and build macOS app
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      TARGET_TRIPLE: aarch64-apple-darwin
      # Job-wide so every cargo step shares one RUSTFLAGS value: RUSTFLAGS is part
      # of Cargo's fingerprint and unit hash, so a step-only value would rebuild
      # the dependency graph and leave the rust-cache key unaware of the flags.
      # Cargo passes `--cap-lints allow` to dependencies, so this only denies
      # warnings in this crate.
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET_TRIPLE"

      # Must run after toolchain setup: the cache key includes the rustc version.
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET_TRIPLE"
