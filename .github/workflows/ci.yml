name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, and build macOS app
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      TARGET_TRIPLE: aarch64-apple-darwin
      # Job-wide so every cargo step shares one RUSTFLAGS value: RUSTFLAGS is part
      # of Cargo's fingerprint and unit hash, so a step-only value would rebuild
      # the dependency graph and leave the rust-cache key unaware of the flags.
      # Cargo passes `--cap-lints allow` to dependencies, so this only denies
      # warnings in this crate.
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check

      - name: Check packaging scripts and notarization recovery
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh scripts/tests/*.sh; do bash -n "$script"; done
          bash scripts/tests/notarization.sh

      # Must run after toolchain setup: the cache key includes the rustc version.
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets

      - name: Lint all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      # The readme-demo skill splices its timeline and the view probe into the
      # debug tuner; this compiles that splice and restores the sources.
      - name: Check the readme-demo and view-probe assets compile
        shell: bash
        run: |
          set -euo pipefail
          bun .agents/skills/readme-demo/scripts/record-demo.ts check
          # Untracked files count too: the splice creates view_probe.rs.
          leftover="$(git status --porcelain)"
          if [ -n "$leftover" ]; then
            printf 'record-demo check left changes behind:\n%s\n' "$leftover"
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET_TRIPLE"
